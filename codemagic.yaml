workflows:
  ios-unsigned:
    name: Ultimate Trip Logger (IPA non signé)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Installer XcodeGen
        script: brew install xcodegen
      - name: Générer le projet Xcode
        script: xcodegen generate
      - name: Compiler
        script: |
          xcodebuild -project UltimateTripLogger.xcodeproj \
            -scheme UltimateTripLogger -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Créer l'IPA
        script: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/UltimateTripLogger.app Payload/
          zip -r UltimateTripLogger.ipa Payload
    artifacts:
      - UltimateTripLogger.ipa
